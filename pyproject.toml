[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "soccertrack-pr"
version = "0.1.0"
description = "SBES 426: SoccerTrack v2 player detection, tracking and external workload analysis"
requires-python = ">=3.12,<3.13"
# Runtime dependencies are pinned in requirements.txt (install with: pip install -r requirements.txt).

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# Default run = fast contract/unit tests on synthetic fixtures only.
# Full runs: `pytest -m data` (needs configs/data_sources.yaml + local data), `pytest -m gpu` (needs CUDA).
addopts = "-m \"not data and not gpu\""
markers = [
    "data: needs the real SoccerTrack files referenced in configs/data_sources.yaml",
    "gpu: needs a CUDA GPU",
]
