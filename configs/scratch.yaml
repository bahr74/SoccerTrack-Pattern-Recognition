sampling:
  train_frame_stride: 10
  background_num_frames: 60
segmentation:
  work_scale: 0.5
  pitch_mask_method: hsv
  hsv_green_low:
  - 35
  - 40
  - 40
  hsv_green_high:
  - 85
  - 255
  - 255
  manual_polygons: {}
  blur_ksize: 5
  diff_colorspace: lab
  diff_threshold: 18
  median_ksize: 5
  open_ksize: 1
  close_ksize: 5
  vertical_dilate: 3
proposals:
  min_area_px: 40
  size_model: linear_height_vs_row
  size_tolerance:
  - 0.35
  - 2.0
  split_wide_blobs: true
  split_width_factor: 1.6
patches:
  height: 64
  width: 32
  context: 0.1
  negatives_per_positive: 3
  negative_mix:
    random: 0.4
    partial: 0.3
    proposal: 0.3
  random_iou_max: 0.1
  partial_iou_range:
  - 0.1
  - 0.4
hog:
  cell:
  - 8
  - 8
  block:
  - 2
  - 2
  bins: 9
  block_norm: L2-Hys
  add_color_hist: false
  color_hist_bins:
  - 8
  - 4
  - 4
svm:
  C_grid:
  - 0.01
  - 0.1
  - 1.0
  - 10.0
  class_weight: balanced
  max_iter: 5000
  hard_negative_rounds: 0
cnn:
  channels:
  - 16
  - 32
  - 64
  dropout: 0.3
  epochs: 15
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 3
  augment:
    hflip: true
    brightness: 0.2
    contrast: 0.2
  device: auto
detector:
  classifier: hog_svm
  nms_iou: 0.5
  operating_threshold: 0.5
  rules:
    aspect_range:
    - 1.2
    - 4.0
    min_fill_ratio: 0.3
tracker_iou:
  iou_gate: 0.3
  n_init: 3
  max_age: 15
  min_score: null
  use_kalman: false
publication:
  size_model: outputs/models/scratch_size_model.json
  backgrounds:
    '117093': outputs/backgrounds/117093.png
